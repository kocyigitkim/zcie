# Build, unit tests and an end-to-end smoke test on macOS and Windows 11 (ADR-027).
name: ci
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash  # Git Bash on Windows: the hooks and the package script need it
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Tools
        run: |
          # RocksDB needs libclang; an empty LIBCLANG_PATH breaks clang-sys on macOS, so set it on Windows only.
          [ "$RUNNER_OS" = Windows ] && echo 'LIBCLANG_PATH=C:\Program Files\LLVM\bin' >> "$GITHUB_ENV"
          command -v jq || { [ "$RUNNER_OS" = macOS ] && brew install jq; }
          jq --version && curl --version | head -1
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Unit tests
        run: cargo test --workspace --lib --bins
      - name: Package
        run: scripts/packaging/build-npm.sh
      - name: Smoke test (install, setup, index, query, hooks)
        run: |
          npm install -g ./dist/zcie-*.tgz
          zcie setup -y --claude none --autostart false --vector off --import false --live false --no-verify
          mkdir -p "$RUNNER_TEMP/demo/src" && cd "$RUNNER_TEMP/demo"
          git init -q && printf 'pub fn apply_discount() {}\n' > src/lib.rs
          zcie project add
          zcie query "where is apply_discount defined" | jq -e '.results | length > 0'
          zcie verify
          zcie daemon stop
      - name: Diagnostics (only after a failure)
        if: failure()
        run: |
          Z="$HOME/.zcie"; H="$Z/hooks"; D="$RUNNER_TEMP/demo"
          K="$Z/config/claude-code.key"; [ -f "$K" ] || K="$Z/config/admin.key"
          export ZCIE_API_KEY_FILE="$K" ZCIE_URL=http://127.0.0.1:47831
          zcie daemon start || true
          cwd="$(cygpath -w "$D" | sed 's/\\/\\\\/g')"
          echo "== user-prompt-submit"; printf '%s' "{\"session_id\":\"d1\",\"cwd\":\"$cwd\",\"prompt\":\"Karar: dağıtım sunucusu ZZTOP42 olacak.\"}" | bash -x "$H/user-prompt-submit.sh" 2>&1 | tail -40
          sleep 3
          echo "== query"; (cd "$D" && zcie query "dağıtım sunucusu" | head -30)
          echo "== inject-context"; printf '%s' "{\"session_id\":\"d2\",\"cwd\":\"$cwd\",\"prompt\":\"Bu projede dağıtım için hangi sunucuyu kullanıyoruz?\"}" | bash -x "$H/inject-context.sh" 2>&1 | tail -60
          echo "== daemon log"; tail -40 "$Z/instances/local/telemetry/logs/zcied.out" || true
          echo "== activity"; tail -8 "$Z/stats/activity.jsonl" || true
      - uses: actions/upload-artifact@v4
        with:
          name: zcie-${{ runner.os }}
          path: dist/zcie-*.tgz
